services:
  # ─── Backend: Express API ────────────────────────────────────────────────────
  - type: web
    name: madyaw-api
    runtime: node
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_EXPIRES_IN
        value: 7d
      # ── Secrets: fill these in the Render dashboard (never commit real values) ──
      - key: MONGODB_URI
        sync: false   # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set manually in Render dashboard
      - key: CLIENT_ORIGIN
        sync: false   # Comma-separated origins: https://madyaw.com,https://madyaw-frontend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false   # Set manually in Render dashboard
      # ── Optional provider secrets (server-only — never add these to the frontend) ──
      - key: RESEND_API_KEY
        sync: false   # Set manually in Render dashboard when email delivery is enabled
      - key: EMAIL_FROM
        sync: false   # e.g. Madyaw Bookings <noreply@yourdomain.com>
      - key: XENDIT_SECRET_KEY
        sync: false   # Set manually in Render dashboard when online payments are enabled
      - key: HOTEL_WEBHOOK_SECRET
        sync: false   # Shared secret for hotel-app POST /api/bookings/hotel-events
      - key: MESSENGER_PAGE_ACCESS_TOKEN
        sync: false   # Meta Messenger Page token (Messenger API Setup)
      - key: MESSENGER_VERIFY_TOKEN
        sync: false   # Your chosen webhook verify string (must match Meta dashboard)
      - key: MADYAW_PUBLIC_URL
        sync: false   # e.g. https://madyaw.com — links in Messenger replies
      - key: HOTEL_APP_PUBLIC_URL
        sync: false   # Hotel HMS origin, no trailing slash — needed to load uploaded payment QR files
      - key: HOTEL_STORAGE_PUBLIC_URL
        sync: false   # Optional S3/Spaces public prefix for payment-qr/* files
      - key: ENABLE_EXTERNAL_RESERVATION_WATCHER
        value: "true" # Mongo change stream sync when hotel updates external_reservations

  # ─── Frontend: React / Vite Static Site ─────────────────────────────────────
  - type: web
    name: madyaw-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      # ── Cache ──────────────────────────────────────────────────────────────
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # ── Security headers (securityheaders.com) ─────────────────────────────
      # HSTS — force HTTPS for 1 year (include www + apex)
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      # Clickjacking protection
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # MIME sniffing (already present via Cloudflare; keep explicit)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Referrer leakage control
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Disable unused browser features (geolocation kept for "Hotels Near Me")
      - path: /*
        name: Permissions-Policy
        value: "accelerometer=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()"
      # XSS / injection baseline — allow Google OAuth, fonts, API, HTTPS images
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://apis.google.com https://accounts.google.com; connect-src 'self' https://madyaw-api.onrender.com https://accounts.google.com https://oauth2.googleapis.com; frame-src 'self' https://accounts.google.com https://apis.google.com; worker-src 'self' blob:; upgrade-insecure-requests"
    routes:
      # SPA fallback — all unknown routes serve index.html (React Router handles them)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # PUBLIC ONLY — every VITE_* value is baked into the browser bundle.
      # Do NOT add JWT / Mongo / Xendit / Resend secrets here.
      - key: VITE_API_URL
        sync: false   # Set to your backend URL: https://madyaw-api.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false   # Same Google Client ID as the backend (public OAuth client ID)

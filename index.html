<!doctype html>
<html lang="en">
  <head>
    <!--
      Content-Security-Policy:
      - script-src includes 'unsafe-inline' for Vite dev mode HMR/module injection.
        For a production hardening step: replace with nonce-based CSP using a build plugin.
      - connect-src: API calls go to /api/* (Vite proxy in dev) and madyaw-api.onrender.com in prod.
        http://localhost entries are intentionally removed — never include http:// origins in production.
      - object-src 'none' blocks Flash, Java applets, and similar plugin-based objects.
      - base-uri 'self' prevents base-tag hijacking attacks.
      - form-action 'self' limits form submissions to same origin.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://apis.google.com https://accounts.google.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://madyaw-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Madyaw Coastal — modern maritime bookings with trusted service and refined stays. Find and book coastal properties with ease." />
    <meta name="theme-color" content="#0f4c75" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/hero/slide-1.png" fetchpriority="high" />
    <title>Madyaw Coastal — Book Your Stay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
